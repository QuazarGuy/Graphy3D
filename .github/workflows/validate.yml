name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build core tests
        run: dotnet build tests/Graphy3D.Core.Tests/Graphy3D.Core.Tests.csproj --configuration Release --warnaserror
      - name: Run core tests
        run: dotnet test tests/Graphy3D.Core.Tests/Graphy3D.Core.Tests.csproj --configuration Release --no-build --no-restore

  windows:
    name: Windows build and rendering
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build Graphy3D.slnx --configuration Release --warnaserror
      - name: Run Windows rendering tests
        run: dotnet test tests/Graphy3D.App.Tests/Graphy3D.App.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
